name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Format check
        run: forge fmt --check
      - name: Build
        run: forge build --sizes
      - name: Test
        # Offline self-consistency check only (test/GenesisBytecode.t.sol) -- catches a
        # preinstalls/*.json hand-edit that corrupts code without updating its codeHash. Does
        # NOT verify against a live chain; run script/VerifyPreinstalls.s.sol by hand against a
        # real RPC whenever a preinstalls/*.json file is added or edited.
        run: forge test -vvv
